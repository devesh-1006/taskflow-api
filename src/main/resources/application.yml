spring:
  application:
    name: taskflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

taskflow:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    expiration: ${JWT_EXPIRATION:PT15M}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
